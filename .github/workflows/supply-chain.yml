name: Supply chain

# Dependency vulnerability audit. Runs on PRs/pushes to main so a newly
# pulled-in advisory is surfaced in review.
#
# REPORT-ONLY (continue-on-error): prints known advisories but does NOT fail the
# build — the repo carries pre-existing advisories (mcp, pyjwt, starlette,
# urllib3, python-multipart, setuptools, pydantic-settings). Flip to blocking
# once those pinned deps are bumped.
#
# NOTE: the "live-LLM in CI" gap (running the provider-integration test
# categories against a real model) is deliberately NOT wired here — it needs
# a DEEPSEEK_API_KEY secret + a seeded provider row, and would spend credits
# on every run. To enable it, add a workflow_dispatch job that seeds a
# `deepseek` provider (framework api-based) into a throwaway openagent.db and
# runs `bash scripts/test_openagent.sh --config <that dir>/openagent.yaml`.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install package + pip-audit
        run: |
          uv venv
          uv pip install -e .
          uv pip install pip-audit

      - name: Audit installed dependency tree (report-only)
        continue-on-error: true
        run: uv run pip-audit --progress-spinner off --skip-editable
