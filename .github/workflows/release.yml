name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # Gate the whole release on the end-to-end suite: no executable is built
  # and nothing is published unless the tests pass on the tagged commit.
  test:
    name: end-to-end test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create venv + install package
        run: |
          uv venv
          HOST_TOOLS_WHEEL="$RUNNER_TEMP/openagent_host_tools-0.1.2-py3-none-any.whl"
          python scripts/acquire-host-tools.py \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/openagent-host-tools" \
            --wheel-output "$HOST_TOOLS_WHEEL"
          uv pip install "$HOST_TOOLS_WHEEL"
          uv pip install -e .
      - name: Run end-to-end suite
        run: bash scripts/test_openagent.sh

  computer-control-binary:
    if: false # superseded by the signed, checksummed openagent-host-tools release bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            out_dir: darwin-arm64
            ext: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            out_dir: linux-x64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out_dir: windows-x64
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact shared host-tools source
        uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent-host-tools
          ref: af6ad6871d4d1208874bf79735710d089f59b959
          path: .openagent-host-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            pkg-config
      - name: Build release binary
        working-directory: .openagent-host-tools/sidecars/computer-control
        run: cargo build --release --target ${{ matrix.target }}
      - name: Sign Rust binary (macOS only)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_LINK not set — leaving binary unsigned"
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/cc-sign.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          P12=$RUNNER_TEMP/cc-sign.p12
          echo "$CSC_LINK" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in CSC_LINK"; exit 1
          fi
          BIN=.openagent-host-tools/sidecars/computer-control/target/${{ matrix.target }}/release/openagent-computer-control
          codesign --force \
            --sign "$IDENTITY" \
            --identifier com.openagent.computer-control \
            --options runtime \
            --timestamp \
            --entitlements buildResources/entitlements.mac.plist \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign -dvv "$BIN" 2>&1 | grep -E '^(Identifier|TeamIdentifier)=' || true
      - uses: actions/upload-artifact@v4
        with:
          name: computer-control-${{ matrix.out_dir }}
          path: .openagent-host-tools/sidecars/computer-control/target/${{ matrix.target }}/release/openagent-computer-control${{ matrix.ext }}

  executable:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host_platform: darwin-arm64
            cc_ext: ''
          - os: macos-15-intel
            host_platform: darwin-x64
            cc_ext: ''
          - os: ubuntu-24.04
            host_platform: linux-x64
            cc_ext: ''
          - os: ubuntu-24.04-arm
            host_platform: linux-arm64
            cc_ext: ''
          - os: windows-2025
            host_platform: win32-x64
            cc_ext: '.exe'
          - os: windows-11-arm
            host_platform: win32-arm64
            cc_ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire consumer-pinned host-tools runtime and wheel
        shell: bash
        run: |
          set -euo pipefail
          HOST_TOOLS_WHEEL="$RUNNER_TEMP/openagent_host_tools-0.1.2-py3-none-any.whl"
          python scripts/acquire-host-tools.py \
            --platform '${{ matrix.host_platform }}' \
            --output "$RUNNER_TEMP/openagent-host-tools" \
            --wheel-output "$HOST_TOOLS_WHEEL"
          echo "OPENAGENT_HOST_TOOLS_WHEEL=$HOST_TOOLS_WHEEL" >> "$GITHUB_ENV"
          echo "OPENAGENT_HOST_TOOLS_BUNDLE=$RUNNER_TEMP/openagent-host-tools/${{ matrix.host_platform }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python deps + PyInstaller
        shell: bash
        run: |
          pip install "$OPENAGENT_HOST_TOOLS_WHEEL"
          pip install -e ".[all]" pyinstaller
      - name: Build Node MCPs
        shell: bash
        run: |
          for mcp_dir in src/mcp/servers/web-search src/mcp/servers/chrome-devtools src/mcp/servers/messaging; do
            if [ -d "$mcp_dir" ]; then
              echo "Building $mcp_dir..."
              (cd "$mcp_dir" && npm install --silent && npm run build --silent 2>/dev/null || true)
            fi
          done
      - name: Build executable
        env:
          OPENAGENT_HOST_TOOLS_BUNDLE: ${{ env.OPENAGENT_HOST_TOOLS_BUNDLE }}
          OPENAGENT_RELEASE_BUILD: '1'
        run: pyinstaller openagent.spec --clean --noconfirm
      - name: Stage verified Node and computer-control sidecars
        shell: bash
        run: |
          set -euo pipefail
          runtime='${{ env.OPENAGENT_HOST_TOOLS_BUNDLE }}'
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "$runtime/node" 'dist/openagent.app/Contents/MacOS/node'
            mkdir -p 'dist/openagent.app/Contents/Helpers'
            ditto "$runtime/openagent-computer-control.app" 'dist/openagent.app/Contents/Helpers/openagent-computer-control.app'
            chmod +x 'dist/openagent.app/Contents/MacOS/node'
          else
            cp "$runtime/node${{ matrix.cc_ext }}" "dist/node${{ matrix.cc_ext }}"
            cp "$runtime/openagent-computer-control${{ matrix.cc_ext }}" "dist/openagent-computer-control${{ matrix.cc_ext }}"
            chmod +x "dist/node${{ matrix.cc_ext }}" "dist/openagent-computer-control${{ matrix.cc_ext }}" || true
          fi
      - name: Sign + notarize macOS .app bundle (+ build stapled .pkg)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_INSTALLER: ${{ secrets.CSC_LINK_INSTALLER }}
          CSC_KEY_PASSWORD_INSTALLER: ${{ secrets.CSC_KEY_PASSWORD_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENAGENT_REQUIRE_SIGNING: '1'
        shell: bash
        run: |
          bash scripts/sign-notarize-macos.sh \
            dist/openagent.app \
            com.openagent.server \
            /Applications
      - name: Package + checksum
        shell: bash
        run: bash scripts/package-release.sh openagent dist
      - uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: |
            dist/openagent-*.tar.gz
            dist/openagent-*.zip
            dist/openagent-*.sha256
            dist/openagent-*.pkg

  release:
    needs: executable
    if: always() && needs.executable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f | head -40
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.pkg
          generate_release_notes: true
