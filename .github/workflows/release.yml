name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify tag and source version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require an exact SemVer tag matching pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          source_version=$(python -c 'from src import __version__; print(__version__)')
          [[ "$version" == "$source_version" ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]

  # Gate the whole release on the end-to-end suite: no executable is built
  # and nothing is published unless the tests pass on the tagged commit.
  test:
    name: end-to-end test suite
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create venv + install package
        run: |
          uv venv
          uv pip install -e .
      - name: Run end-to-end suite
        run: bash scripts/test_openagent.sh

  computer-control-binary:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            out_dir: darwin-arm64
            ext: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            out_dir: linux-x64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out_dir: windows-x64
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            pkg-config
      - name: Build release binary
        working-directory: src/mcp/servers/computer-control
        run: cargo build --release --target ${{ matrix.target }}
      - name: Sign Rust binary (macOS only)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_LINK not set — leaving binary unsigned"
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/cc-sign.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          P12=$RUNNER_TEMP/cc-sign.p12
          echo "$CSC_LINK" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in CSC_LINK"; exit 1
          fi
          BIN=src/mcp/servers/computer-control/target/${{ matrix.target }}/release/openagent-computer-control
          codesign --force \
            --sign "$IDENTITY" \
            --identifier com.openagent.computer-control \
            --options runtime \
            --timestamp \
            --entitlements buildResources/entitlements.mac.plist \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign -dvv "$BIN" 2>&1 | grep -E '^(Identifier|TeamIdentifier)=' || true
      - uses: actions/upload-artifact@v4
        with:
          name: computer-control-${{ matrix.out_dir }}
          path: src/mcp/servers/computer-control/target/${{ matrix.target }}/release/openagent-computer-control${{ matrix.ext }}

  executable:
    needs: [test, computer-control-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cc_target: darwin-arm64
            cc_ext: ''
          - os: ubuntu-latest
            cc_target: linux-x64
            cc_ext: ''
          - os: windows-latest
            cc_target: windows-x64
            cc_ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download computer-control binary
        uses: actions/download-artifact@v4
        with:
          name: computer-control-${{ matrix.cc_target }}
          path: src/mcp/servers/computer-control/bin/${{ matrix.cc_target }}/
      - name: Make binary executable
        if: runner.os != 'Windows'
        run: chmod +x src/mcp/servers/computer-control/bin/${{ matrix.cc_target }}/openagent-computer-control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python deps + PyInstaller
        run: pip install -e ".[all]" pyinstaller
      - name: Build Node MCPs
        shell: bash
        run: |
          set -euo pipefail
          for mcp_dir in src/mcp/servers/web-search src/mcp/servers/editor src/mcp/servers/messaging src/mcp/servers/vault; do
            echo "Building $mcp_dir..."
            (cd "$mcp_dir" && npm ci --silent && npm run build --silent)
          done
          (cd src/mcp/servers/agent-in-chrome/host && npm ci --silent)
      - name: Build executable
        run: pyinstaller openagent.spec --clean --noconfirm
      - name: Stage computer-control sidecar next to dist/openagent
        shell: bash
        run: |
          set -euo pipefail
          src="src/mcp/servers/computer-control/bin/${{ matrix.cc_target }}/openagent-computer-control${{ matrix.cc_ext }}"
          dst="dist/openagent-computer-control${{ matrix.cc_ext }}"
          cp "$src" "$dst"
          chmod +x "$dst" || true
      - name: Sign + notarize macOS .app bundle (+ build stapled .pkg)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_INSTALLER: ${{ secrets.CSC_LINK_INSTALLER }}
          CSC_KEY_PASSWORD_INSTALLER: ${{ secrets.CSC_KEY_PASSWORD_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          bash scripts/sign-notarize-macos.sh \
            dist/openagent.app \
            com.openagent.server \
            /Applications \
            dist/openagent-computer-control
      - name: Package + checksum
        shell: bash
        run: bash scripts/package-release.sh openagent dist
      - name: Smoke-test the packaged release
        shell: bash
        run: bash scripts/test-release-package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: |
            dist/openagent-*.tar.gz
            dist/openagent-*.zip
            dist/openagent-*.sha256
            dist/openagent-*.pkg

  release:
    needs: executable
    if: always() && needs.executable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: executable-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the exact local release set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/verify-release-assets.py artifacts "$version"
      - name: Refuse to overwrite an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              >existing-release.json 2>release-guard-error.log; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to overwrite it"
            exit 1
          fi
          if ! grep -q '(HTTP 404)' release-guard-error.log; then
            echo "::error::Could not prove that release $GITHUB_REF_NAME is absent"
            exit 1
          fi
      - name: Attest release archives and installer
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            artifacts/openagent-*-linux-x64.tar.gz
            artifacts/openagent-*-macos-arm64.pkg
            artifacts/openagent-*-windows-x64.zip
      - name: Upload an unpublished draft release
        id: draft
        uses: softprops/action-gh-release@v2.6.2
        with:
          draft: true
          files: |
            artifacts/openagent-*-linux-x64.tar.gz
            artifacts/openagent-*-linux-x64.tar.gz.sha256
            artifacts/openagent-*-macos-arm64.pkg
            artifacts/openagent-*-macos-arm64.pkg.sha256
            artifacts/openagent-*-windows-x64.zip
            artifacts/openagent-*-windows-x64.zip.sha256
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          make_latest: ${{ contains(github.ref_name, '-beta.') && 'false' || 'true' }}
      - name: Verify uploaded bytes, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          is_beta=false
          make_latest=true
          if [[ "$version" == *-beta.* ]]; then
            is_beta=true
            make_latest=false
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-draft.json
          python scripts/verify-release-assets.py artifacts "$version" \
            --release-json release-draft.json \
            --expect-draft true \
            --expect-prerelease "$is_beta"
          python - "$is_beta" "$make_latest" > publish.json <<'PY'
          import json, sys
          json.dump({
              "draft": False,
              "prerelease": sys.argv[1] == "true",
              "make_latest": sys.argv[2],
          }, sys.stdout)
          PY
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input publish.json > release-published.json
          python scripts/verify-release-assets.py artifacts "$version" \
            --release-json release-published.json \
            --expect-draft false \
            --expect-prerelease "$is_beta"
