# OpenAgent full-config reference
# =============================================================================
# Every option this server reads, with a one-line "why" and the default it
# falls back to when the key is missing. Most installs only need a small
# subset — start with the bare ``openagent.yaml`` produced by ``openagent
# init`` and copy stanzas from here as you turn features on.
#
# Convention: every recent feature ships off-by-default so an unset key
# behaves like the pre-feature shipped code. Turning a section on is the
# only way it engages.
# =============================================================================

# Display name shown in the network roster and on first-run banners.
name: agent

# ── Network identity ────────────────────────────────────────────────
# Iroh transport keys + DERP relay. Defaults are usually correct;
# self-host a DERP relay only when you need full data locality.
network:
  identity_path: ./identity.key
  coordinator:
    key_path: ./coordinator.key
  derp_url: ""                # empty = Iroh's public DERP relay

# ── Channels (platform bridges) ─────────────────────────────────────
# Each bridge is opt-in: omit the section and the bridge isn't started.
# ``personality`` accepts a preset name (casual, technical, teacher,
# kawaii, pirate, noir, philosopher) OR a free-form string treated as
# the literal persona directive.
#
# ``live`` (default true) makes the bridge narrate the turn in-chat:
# each tool call and each span of the answer is posted as its own
# message while the "is writing" indicator stays lit — the Hermes-style
# feed. Set ``live: false`` per channel (or ``OPENAGENT_CHANNEL_LIVE=0``
# globally) to fall back to a single final reply per turn. Voice-note
# turns always use the single-reply path regardless of this setting.
channels:
  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"     # or hard-code; env wins if both set
    allowed_users: []                  # list of Telegram user_ids ("12345"); empty = open
    personality: casual
    live: true                         # narrate tool calls + answer as separate messages

  discord:
    token: "${DISCORD_BOT_TOKEN}"
    allowed_users: ["123456789012345678"]
    allowed_guilds: []
    listen_channels: []                # public channels to listen to
    dm_only: false
    personality: technical

  whatsapp:
    green_api_id: "${GREEN_API_ID}"
    green_api_token: "${GREEN_API_TOKEN}"
    allowed_users: []                  # phone numbers ("39…")
    personality: casual

  slack:
    bot_token: "${SLACK_BOT_TOKEN}"    # xoxb-…
    app_token: "${SLACK_APP_TOKEN}"    # xapp-… (socket mode)
    allowed_users: ["U0123456789"]
    listen_channels: ["C0123456789"]
    personality: technical

  # The one INBOUND channel: a dedicated HTTP listener on its own port
  # serving only /hooks/*. An external service (or a peer) calls it to fire
  # an Event — a workflow, a scheduled task, or a chat session. Off by
  # default; manage events in the app's Events screen / the events-manager MCP.
  webhook:
    enabled: false
    host: 0.0.0.0
    port: 8899
    public_url: "https://hooks.example.com"   # optional; shown in the UI

# ── Safety ──────────────────────────────────────────────────────────
# One toggle, off by default. It is a blocklist, NOT an approval prompt:
# a matching command is refused outright and the model is told why — no
# human is asked, because a scheduled task firing at 3am has nobody to
# ask. ("approvals" is the historical key name; it is kept so existing
# configs keep working.)
#
# Scope — this covers the ``shell_exec`` tool ONLY. The editor MCP and
# any registered filesystem MCP are NOT gated and can still delete or
# overwrite anything they can reach. It is also a regex over the command
# text, so it stops a mistake (`rm -rf /` typed literally) and not an
# adversary (base64, a variable, a heredoc, or a script file all slip
# past). Treat it as a seatbelt, not a sandbox.
#
# Leave it off unless you know your agent doesn't do the things below by
# design — the Lyra agent, for one, force-pushes its own branch on every
# run and would break instantly with this on.
safety:
  approvals:
    enabled: false                      # DEFAULT — off; every command runs unchecked
    # When true, shell_exec refuses a command matching any of these
    # built-in patterns (case-insensitive, substring):
    #   rm -rf /…            sudo rm            dd if=
    #   mkfs…                > /dev/sd[a-z]     chmod [-R] NNN /…
    #   git push --force|-f  git reset --hard HEAD|origin
    #   kubectl delete       docker rm -f|rmi -f|system prune -a
    #   drop database|table  shutdown|reboot    halt|poweroff
    # Extend that list with your own regex fragments:
    block_extra_patterns:
      - "\\bterraform\\s+destroy\\b"
    # …and carve exceptions out of it. An allow pattern WINS over a block
    # pattern, so this is how you keep the list on for an agent that
    # legitimately does one thing on it. Without this the stanza is
    # all-or-nothing, and an agent that force-pushes its own branch every
    # run (as the Lyra agent does) forces you to disable every other
    # protection to keep working — so you would, and then none of this
    # would be on at all.
    #
    # Be specific. ``git push --force`` as an allow pattern re-permits it
    # everywhere; scope it to the branch the agent owns instead:
    # allow_patterns:
    #   - "git push --force[a-z-]* origin lyra-agent/"

# ── Memory & learning ───────────────────────────────────────────────
# Every subsection is independent.
#
# ``user_profile`` and ``skills`` used to be documented here. Both were
# deleted in v0.15.11 (opaque parallel memory stores competing with the
# vault) and neither key is read any more — they are listed here only so
# you don't go looking for them. A leftover block for either in your
# openagent.yaml is inert, not an error.
memory:
  curator:
    enabled: false                      # background prune of stale skills/profiles + DB backup
    interval_hours: 6
    skill_stale_days: 14                # unused skills past this age get pruned
    skill_archive_days: 90              # any skill past this gets pruned regardless of usage
    profile_archive_days: 90
    session_retention_days: 90
    backup_interval_hours: 24
    backup_keep: 30

  sessions:
    retention_days: 90                  # friendlier alias for curator.session_retention_days

  # vault_path: ~/my-vault              # where the Markdown memory vault lives (default: <data-dir>/memories)

  vault_reminder:
    enabled: true                       # on by default: inject a "ALWAYS save to the vault" checkpoint into the turn
    every_n_turns: 3                     # fires on the first turn, then every N turns

  semantic_search:
    enabled: false                      # embed conversation turns for similarity recall (needs an OpenAI key)

  # Code-enforced quality gate over the Markdown vault: atomic notes,
  # complete frontmatter, dense real wikilinks, no orphans/broken links,
  # one connected graph. Exposed to the agent as the ``vault-gate`` MCP and
  # over REST (/api/vault/gate, /doctor, /stats, /derived, /index/sync).
  vault:
    enabled: true                       # the gate subsystem (index + tools + validate-on-write)
    max_lines: 300                      # a note longer than this is flagged (atomicity)
    min_outlinks: 3                     # a content note should link out to >= this many real notes
    enforce_taxonomy: false             # nudge tags[0]==folder + channels-as-tags (advisory)
    check_em_dash: false                # flag em dashes (—) everywhere, not just journal notes
    strict: false                       # treat every issue as an error (the "0 errors" target)
    validate_on_write: true             # REST note writes return quality warnings + keep the index current
    git:
      enabled: true                     # back the vault with a git repo; auto-commit every change (with provenance)
      autocommit_seconds: 25            # sweep interval that captures edits made outside OpenAgent (Obsidian, external MCP); 0 disables
      author_name: OpenAgent            # committer identity (no global git config needed)
      author_email: agent@openagent.local
    maintenance:
      enabled: false                    # dream-mode pass: gate, auto-fix, regenerate derived, write a dream-log
      interval_hours: 12
      autofix: true                     # apply the mechanical fixes a script can make safely
      regenerate_derived: true          # rewrite llms.txt + _showcase/showcase.md each pass

# ── Quick commands ──────────────────────────────────────────────────
# Bridges expand ``/<trigger>`` to the configured prompt before the
# agent sees it. Triggers are case-insensitive. Anything after the
# trigger is appended as a second line.
quick_commands:
  recap: "Summarise the last 20 turns with bullets, English."
  jokes: "Tell me three short jokes."
  status: "What's the status of my ongoing projects?"

# ── Hooks ───────────────────────────────────────────────────────────
# Fire-and-forget shell commands triggered by named runtime events.
# Event metadata arrives in OPENAGENT_EVENT_* env vars. Stdout captured
# (4 KB cap) into events.jsonl.
hooks:
  on_turn_end:        "echo turn $OPENAGENT_EVENT_SESSION_ID >> ~/openagent/turns.log"
  on_compression:     "logger -t openagent compressed $OPENAGENT_EVENT_SESSION_ID"
  on_skill_saved:     "osascript -e 'display notification \"new skill: $OPENAGENT_EVENT_NAME\" with title \"OpenAgent\"'"

# ── MCP runtime knobs ───────────────────────────────────────────────
# Not yaml-configurable today — set via env at launch time:
#   OPENAGENT_CLAUDE_TOOL_BUDGET=55   # default 200 — tools allowed in upfront list
#   OPENAGENT_AGNO_TOOL_BUDGET=55     # default 128 — same for the Agno classifier path
#   OPENAGENT_MCP_PRIORITY=vault,messaging,shell,editor,filesystem,web-search,scheduler
#     # override the default priority order used when trimming above the budget.
#     # Unlisted MCPs fall back to alphabetical, then get dropped.

# ── Notes ───────────────────────────────────────────────────────────
# Providers, models, MCP entries, scheduled tasks, and workflows are
# managed exclusively through the SQLite database (configure via the
# desktop app, the model-manager / mcp-manager / workflow-manager MCPs,
# or the /api/* REST endpoints). This file only holds server-level
# knobs.
