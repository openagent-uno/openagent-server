; OpenAgent shared "machine" supervisor config.
; One container runs the network stack (tailscaled+tailscale via containerboot),
; the model backend (claude-sub-proxy), and the OpenAgent runtime together.
; All programs inherit the container environment (TS_*, CLAUDE_SUB_PROXY_*, OPENAGENT_*).
; Lives at /etc/supervisord.conf so bare `supervisorctl status` works (the agent can
; manage its own daemons: e.g. `supervisorctl restart openagent`).
;
; SOURCE OF TRUTH: this file is the version-controlled copy of the image's
; /etc/supervisord.conf. The Docker image build MUST install it there (COPY
; deploy/supervisord.conf /etc/supervisord.conf) AND install the retention
; module next to it (COPY src/core/session_retention.py /opt/openagent/
; session_retention.py) so the `session-retention` program below can run on a
; FRESH PVC/pod. Historically the retention script + this program block lived
; ONLY on the per-agent PVC, so a fresh PVC / pod migration / config reset
; silently disabled ALL DB pruning and openagent.db drifted back to ~2 GB of
; bloat + WAL-lock outages. Keeping both in the image makes retention durable.
[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- Tailscale (daemon IN the machine): tailscaled, `tailscale up`, applies serve config ---
[program:tailscale]
command=/usr/local/bin/containerboot
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Model backend: Claude subscription via the OpenAI-compatible proxy on :8787 ---
[program:claude-sub-proxy]
command=/usr/local/bin/claude-sub-proxy serve
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- The agent itself (agent dir on the per-agent PVC at /data/agent) ---
; Runs the image-baseline binary; the self-updater later swaps in
; /data/agent/bin/openagent on the PVC. Per-pod env (embedding URL, recall
; scopes, compaction knobs, …) comes from the k8s Deployment environment, not
; from this image-level config.
[program:openagent]
command=/opt/openagent/bin/openagent -d /data/agent serve
autorestart=true
# The frozen one-file launcher is a process-group leader and the actual Python
# server is its child.  Stopping only the launcher can orphan the child that
# owns SQLite; the next start then overlaps two agents and preserves the old
# WAL read snapshot.  Always signal/kill the complete group.
stopasgroup=true
killasgroup=true
startsecs=5
startretries=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- DB retention daemon: keeps /data/agent/openagent.db bounded ---
; Prunes old/oversized `sessions` per openagent.yaml `retention:` (days /
; max_runs / interval_hours / trim_threshold_bytes). Runs the repo module
; (src/core/session_retention.py) installed into the image at
; /opt/openagent/session_retention.py — it is stdlib-only, so bare system
; python3 runs it. --daemon prunes now, then loops every interval_hours.
; Defaults inside the script point --db/--config at /data/agent (the runtime
; PVC), so no flags are needed here.
[program:session-retention]
command=/usr/bin/python3 /opt/openagent/session_retention.py --daemon
autorestart=true
startsecs=3
startretries=10
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
